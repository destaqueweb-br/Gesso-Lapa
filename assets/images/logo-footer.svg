<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 230 52" width="230" height="52" fill="none" role="img" aria-label="Gesso Lapa - Reforma em Geral">
  <!-- ICON EMBLEM -->
  <g transform="translate(4, 2) scale(0.48)">
    <!-- House Roof Outline -->
    <path d="M48 6 L12 36 L20 36 L20 39 L48 15 L76 39 L76 36 L84 36 Z" fill="#F8FAFC" />
    <path d="M48 8 L16 34 L80 34 Z" fill="none" stroke="#F8FAFC" stroke-width="4" stroke-linejoin="round"/>
    <!-- Chimney -->
    <path d="M64 16 L64 30 L74 30 L74 24 Z" fill="#F8FAFC" />
    
    <!-- Ceilings / Plaster Tiers (Forros de Gesso) -->
    <!-- Tier 1: Gold / Sand tier -->
    <path d="M22 42 L48 26 L74 42 L66 48 L48 38 L30 48 Z" fill="#E8C77E" />
    <polygon points="48,26 74,42 66,48 48,38" fill="#F3E5B5" />
    
    <!-- Tier 2: Winged Plaster Ceiling / Sanca -->
    <path d="M12 56 L48 70 L84 56 L76 50 L48 62 L20 50 Z" fill="#CBD5E1" />
    <polygon points="48,70 84,56 76,50 48,62" fill="#FFFFFF" />
    
    <!-- House Foundation Frame -->
    <path d="M20 58 L20 84 L40 84" fill="none" stroke="#F8FAFC" stroke-width="4.5" stroke-linecap="round" />
    <path d="M76 58 L76 84 L56 84" fill="none" stroke="#F8FAFC" stroke-width="4.5" stroke-linecap="round" />
    
    <!-- Upward Growth / Renovation Arrow -->
    <path d="M38 84 C38 72 44 68 48 62" fill="none" stroke="#E27D30" stroke-width="4.5" stroke-linecap="round" />
    <path d="M48 55 L41 65 L55 65 Z" fill="#E27D30" />
  </g>

  <!-- BRAND TYPOGRAPHY -->
  <g transform="translate(56, 0)">
    <!-- "GESSO" -->
    <text x="0" y="20" font-family="'Inter', 'Montserrat', 'Helvetica Neue', sans-serif" font-size="19" font-weight="800" fill="#FFFFFF" letter-spacing="1.5">GESSO</text>
    <!-- "LAPA" -->
    <text x="74" y="20" font-family="'Inter', 'Montserrat', 'Helvetica Neue', sans-serif" font-size="19" font-weight="900" fill="#E8C77E" letter-spacing="2">LAPA</text>
    
    <!-- Copper / Orange Accent Line -->
    <path d="M0 26 Q80 29 164 26" stroke="#E27D30" stroke-width="2.2" stroke-linecap="round" fill="none" />
    
    <!-- "REFORMA EM GERAL" -->
    <text x="0" y="42" font-family="'Playfair Display', 'Cinzel', 'Georgia', serif" font-size="9.5" font-weight="600" fill="#CBD5E1" letter-spacing="3.2">REFORMA EM GERAL</text>
  </g>
</svg>
